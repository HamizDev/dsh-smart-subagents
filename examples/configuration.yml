# Example values for the plugin row in your DSH profile's cordis.patch.yml.
# If the installed native subagent tools are disabled, enable them in the active
# agent preset (e.g. standard); this policy plugin does NOT enable them.
- insert:
    - id: smart-subagents
      name: '@hamizdev/dsh-smart-subagents'
      config:
        mode: balanced          # off | conservative | balanced | aggressive
        maxParallel: 3          # guidance ceiling only; native limits still apply
        preferForkForContext: true
