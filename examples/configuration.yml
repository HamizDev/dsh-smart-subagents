# v0.3.0: Installing Smart Subagents also installs and mounts AgentTeams.
# The team panel is provided by @nanmicoder/dsh-agent-teams@0.1.22.
# Do NOT separately install AgentTeams in the same profile.
# Optional advanced routing: configure @gjs27/dsh-value-router separately
# until a verified npm distribution is available for dependency pinning.
- insert:
    - id: agent-teams
      name: '@nanmicoder/dsh-agent-teams'
      config:
        stateDir: .agent-teams
        memberProvider: spawn
    - id: smart-subagents
      name: '@hamizdev/dsh-smart-subagents'
      config:
        mode: balanced
        maxParallel: 3
        preferForkForContext: true
        preferAgentTeams: true
        teamMinWorkstreams: 2
        requireTeamApproval: true
