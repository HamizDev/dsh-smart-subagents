# DSH Smart Subagents v0.3.0: a single installable composition layer.
# AgentTeams is a pinned runtime dependency; its own bundle patch is NOT
# automatically loaded transitively. Mount it here, then our policy.
# Do NOT install a second independent AgentTeams bundle into the same profile.
- insert:
    - id: agent-teams
      name: '@nanmicoder/dsh-agent-teams'
      config:
        stateDir: .agent-teams
        memberProvider: spawn
    - id: smart-subagents
      name: '@hamizdev/dsh-smart-subagents'
      config:
        mode: balanced
        maxParallel: 3
        preferForkForContext: true
        preferAgentTeams: true
        teamMinWorkstreams: 2
        requireTeamApproval: true
