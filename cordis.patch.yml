# Smart Subagents v0.2: only contributes a prompt policy.
# To show the Team collaboration interface, install AgentTeams separately.
- insert:
    - id: smart-subagents
      name: '@hamizdev/dsh-smart-subagents'
      config:
        mode: balanced
        maxParallel: 3
        preferForkForContext: true
        preferAgentTeams: true
        teamMinWorkstreams: 2
        requireTeamApproval: true
